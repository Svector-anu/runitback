# DISABLED in GitHub Actions settings. The active deploy path is Vercel's native Git integration; this workflow is the
# CI-gated alternative and must only be enabled together with turning that integration's auto-deploy off (docs/RELEASE.md section 3).
name: deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run's branches filter checks the *base* branch for pull_request-triggered
    # runs, not the head branch — so it cannot be trusted to exclude PR runs targeting
    # main. Gate explicitly on event type + head branch instead.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip if main has moved on
        id: latest
        run: |
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main is at $current, not ${{ github.event.workflow_run.head_sha }}; a newer run will deploy it."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Vercel secrets are configured
        if: steps.latest.outputs.stale != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing one or more required secrets (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID). Add them under Settings > Secrets and variables > Actions before this workflow can deploy."
            exit 1
          fi

      - name: Install Vercel CLI
        if: steps.latest.outputs.stale != 'true'
        run: npm install --global vercel@58.4.4

      - name: Deploy to Vercel (production)
        if: steps.latest.outputs.stale != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token="$VERCEL_TOKEN" --yes
