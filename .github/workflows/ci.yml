name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm eval
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install ffmpeg (H.264 test media for e2e/perf-media.spec.ts)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-gates
          path: e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore

  e2e-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          PLAYWRIGHT_TARGET: production
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-production
          path: e2e/.artifacts
          retention-days: 7
          if-no-files-found: ignore
